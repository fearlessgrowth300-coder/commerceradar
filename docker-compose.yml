# Local development stack. Ports bind to 127.0.0.1 only.
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/initdb:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: *api-env
    volumes: [./apps/api:/app]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./apps/api
    init: true # reaps finished health checks (1,944 zombies accumulated without it, 2026-11-09)
    command: celery -A app.worker worker -Q celery,verification,discovery,products --loglevel=info --concurrency=${WORKER_CONCURRENCY:-2}
    environment: *api-env
    volumes: [./apps/api:/app, zonedata:/zones] # zonedata: CZDS zone lists (source czds_zonefile)
    stop_grace_period: 60s # let running tasks finish (warm shutdown)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 30s
      retries: 3

  verifier:
    # Verification + product queues on threads: both are mostly waiting on the network (a check is
    # ~0.1 s CPU; product runs sleep PRODUCT_PAGE_DELAY between pages), so threads run many at once
    # cheaply (measured 2026-11-09: 8 threads ~35k checks/h). Verification rate is still capped by
    # MONITOR_BACKLOG_PER_TICK / MONITOR_MAX_IN_FLIGHT. Keep threads <= 15: a product run holds a DB
    # connection while it sleeps, and the SQLAlchemy pool is 5 + 10 overflow per process.
    build: ./apps/api
    init: true
    command: celery -A app.worker worker -Q verification,products --pool threads --concurrency=${VERIFIER_THREADS:-12} --loglevel=info --hostname=verifier@%h
    environment: *api-env
    volumes: [./apps/api:/app]
    stop_grace_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d verifier@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 30s
      retries: 3

  beat:
    # Scheduler. Exactly one instance: it only enqueues the bounded monitoring tick.
    build: ./apps/api
    command: celery -A app.worker beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment: *api-env
    volumes: [./apps/api:/app]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    command: npm run dev
    environment:
      API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  zonedata:
